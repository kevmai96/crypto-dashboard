<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Visualization Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@2.23.0/dist/date-fns.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@2.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="container">
        <h1>Crypto Dashboard</h1>
        <p>Compare the last 30 days of price data for two cryptocurrencies.</p>
        <div class="controls">
            <select id="coin-select-1">
                <option value="bitcoin" selected>Bitcoin</option>
                <option value="ethereum">Ethereum</option>
                <option value="solana">Solana</option>
                <option value="dogecoin">Dogecoin</option>
            </select>
            <span>vs.</span>
            <select id="coin-select-2">
                <option value="bitcoin">Bitcoin</option>
                <option value="ethereum" selected>Ethereum</option>
                <option value="solana">Solana</option>
                <option value="dogecoin">Dogecoin</option>
            </select>
        </div>
        <div id="chart-container">
            <canvas id="price-chart"></canvas>
        </div>
    </div>

    <script src="index.js"></script>

</body>
</html>
